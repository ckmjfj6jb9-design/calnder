<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍽️ 約飯GoGoGo</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F7F9FC;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #2D3748;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #38A169;
      background-color: #F0FFF4;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #38A169;
      border-radius: 50%;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      background: #EDF2F7;
      padding: 12px;
      border-radius: 12px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 人名選單與色圈容器 */
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    /* 人名旁的專屬顏色小圓圈 */
    .color-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 2px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    select {
      border: none;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      background: transparent;
      cursor: pointer;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      color: #2D3748;
    }

    .nav-btn {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instructions {
      font-size: 12px;
      color: #718096;
      text-align: center;
      margin-bottom: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday-header {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #A0AEC0;
      padding-bottom: 6px;
    }

    .day-cell {
      min-height: 75px;
      background: #FAFAFA;
      border: 1px solid #EDF2F7;
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .day-cell:active {
      transform: scale(0.96);
    }

    /* 🔴 當有人唔得閒時，整格日期變淡紅色背景 */
    .day-cell.has-busy {
      background-color: #FFF5F5 !important;
      border-color: #FEB2B2 !important;
    }

    .day-cell.has-busy .day-number {
      color: #E53E3E !important;
      font-weight: bold;
    }

    .day-cell.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .day-number {
      font-size: 12px;
      font-weight: 600;
      color: #4A5568;
    }

    /* 日期內的唔得閒 Label */
    .busy-tag {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 4px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .busy-tag.maybe {
      opacity: 0.55;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🍽️ 約飯GoGoGo</h1>
    <div class="status-badge">
      <span class="status-dot"></span> 系統已準備就緒
    </div>
  </div>

  <div class="controls">
    <div class="control-row">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 14px; font-weight: 500;">我是：</span>
        <div class="user-select-container">
          <!-- 專屬顏色小圓圈 -->
          <span class="color-circle" id="userColorDot"></span>
          <select id="userSelect" onchange="updateUserColorDot()">
            <!-- 成員選單 -->
          </select>
        </div>
      </div>

      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
        <span id="monthYearDisplay">2026/8月</span>
        <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
      </div>
    </div>
  </div>

  <div class="instructions">
    💡 點擊日期：<b>標示唔得閒</b> ➔ <b>待定</b> ➔ <b>取消</b>
  </div>

  <div class="calendar-grid" id="calendarGrid">
    <!-- 日曆由 JavaScript 動態生成 -->
  </div>
</div>

<script>
  // 7 位成員及其最新更新的代表顏色
  const members = [
    { name: "Emily",  color: "#2D2D2D", textColor: "#FFFFFF" }, // 黑色
    { name: "felix",  color: "#D1C4E9", textColor: "#2D2D2D" }, // 淺紫色
    { name: "kelly",  color: "#FFF59D", textColor: "#2D2D2D" }, // 淺黃色
    { name: "helen",  color: "#81D4FA", textColor: "#2D2D2D" }, // 淺藍色
    { name: "angel",  color: "#F8BBD0", textColor: "#2D2D2D" }, // 淺粉紅
    { name: "anson",  color: "#6A1B9A", textColor: "#FFFFFF" }, // 深紫色
    { name: "jaimie", color: "#FFCA28", textColor: "#2D2D2D" }  // 橙黃色
  ];

  let currentDate = new Date(2026, 7, 1); // 預設 2026 年 8 月
  let busyData = JSON.parse(localStorage.getItem('gogogo_busy_data')) || {};

  function init() {
    renderUserSelect();
    updateUserColorDot();
    renderCalendar();
  }

  // 渲染人名選單
  function renderUserSelect() {
    const select = document.getElementById('userSelect');
    select.innerHTML = '';
    members.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.innerText = m.name;
      select.appendChild(opt);
    });
  }

  // 切換「我是：[人名]」時，更新旁邊的小圓圈顏色
  function updateUserColorDot() {
    const currentUser = document.getElementById('userSelect').value;
    const memberInfo = members.find(m => m.name === currentUser);
    const dot = document.getElementById('userColorDot');
    if (memberInfo) {
      dot.style.backgroundColor = memberInfo.color;
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  // 點擊日期的切換邏輯
  function toggleStatus(dateStr) {
    const currentUser = document.getElementById('userSelect').value;
    if (!busyData[dateStr]) {
      busyData[dateStr] = {};
    }

    const currentStatus = busyData[dateStr][currentUser];
    
    if (!currentStatus) {
      busyData[dateStr][currentUser] = 'busy';  // 撳 1 下：確定唔得閒
    } else if (currentStatus === 'busy') {
      busyData[dateStr][currentUser] = 'maybe'; // 撳 2 下：待定
    } else {
      delete busyData[dateStr][currentUser];    // 撳 3 下：取消
    }

    localStorage.setItem('gogogo_busy_data', JSON.stringify(busyData));
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYearDisplay').innerText = `${year}/${month + 1}月`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(day => {
      const header = document.createElement('div');
      header.className = 'weekday-header';
      header.innerText = day;
      grid.appendChild(header);
    });

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    // 月初空白格
    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      grid.appendChild(emptyCell);
    }

    // 生成每個日子格仔
    for (let day = 1; day <= totalDays; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      
      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      const dateKey = `${year}-${monthStr}-${dayStr}`;

      // 檢查當天是否有任何人「確定唔得閒」
      let isAnyBusy = false;
      if (busyData[dateKey]) {
        isAnyBusy = Object.values(busyData[dateKey]).some(status => status === 'busy');
      }

      // 如果有人確定唔得閒，把格仔加上紅色警示樣式
      if (isAnyBusy) {
        cell.classList.add('has-busy');
      }

      const dayNum = document.createElement('div');
      dayNum.className = 'day-number';
      dayNum.innerText = day;
      cell.appendChild(dayNum);

      // 顯示唔得閒名單 Label
      if (busyData[dateKey]) {
        Object.keys(busyData[dateKey]).forEach(userName => {
          const status = busyData[dateKey][userName];
          const memberInfo = members.find(m => m.name === userName);

          if (memberInfo) {
            const tag = document.createElement('div');
            tag.className = `busy-tag ${status === 'maybe' ? 'maybe' : ''}`;
            tag.style.backgroundColor = memberInfo.color;
            tag.style.color = memberInfo.textColor;
            tag.innerText = status === 'maybe' ? `(${userName}?)` : `(${userName})`;
            cell.appendChild(tag);
          }
        });
      }

      // 綁定點擊事件
      cell.onclick = () => toggleStatus(dateKey);
      grid.appendChild(cell);
    }
  }

  init();
</script>

</body>
</html>
